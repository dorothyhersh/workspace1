name: Emulator Test - Infinix Smart 8 Plus Profile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  emulator-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Emulator + Apply Screen Profile + Take Screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics
          disable-animations: true
          script: |
            echo "===== Applying Infinix Smart 8 Plus screen profile ====="
            adb shell wm size 720x1612
            adb shell wm density 270
            sleep 3

            echo "===== Display settings ====="
            adb shell wm size
            adb shell wm density

            echo "===== Device info (emulator values) ====="
            adb shell getprop ro.product.model
            adb shell getprop ro.product.manufacturer
            adb shell getprop ro.build.version.release

            echo "===== Taking screenshot ====="
            adb exec-out screencap -p > screenshot.png
            ls -l screenshot.png

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinix-smart-8-plus-screenshot
          path: screenshot.png
          retention-days: 7
