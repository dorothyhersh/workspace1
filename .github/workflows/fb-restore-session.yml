name: FB - Restore saved Facebook login from Mega into the emulator (download on runner IP, restore on phone IP)

on:
  workflow_dispatch:
    inputs:
      account:
        description: "FB_IDENTIFIER (email) row to use from the Mega sheet. Empty = first row."
        required: false
        default: ""
      backup_file:
        description: "Optional: exact backup name in Mega (e.g. fb-session-<email>.20261121-003351.tgz.enc). Empty = latest, from the sheet row."
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  PHONE_IP: 100.85.72.32
  MEGA_CONF_FOLDER: Fbworkflow
  MEGA_CONF_FILE: login_Setup_Setting_workflow_conf.xlsx
  MEGA_REMOTE: mega          # must be the remote name inside your RCLONE_CONF (scripts/config.sh uses the same)

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # ---- 0. read email / password / tailscale keys from the xlsx in Mega ----
      - name: Load settings from Mega (Fbworkflow/login_Setup_Setting_workflow_conf.xlsx)
        env:
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
          ACCOUNT: ${{ github.event.inputs.account }}
        run: |
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j /tmp/rclone.zip '*/rclone' -d /tmp && sudo install -m755 /tmp/rclone /usr/local/bin/rclone
          pip install -q openpyxl
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF_CONTENT" > ~/.config/rclone/rclone.conf
          REMOTE="$MEGA_REMOTE"
          rclone listremotes | grep -qx "${REMOTE}:" || { echo "remote '${REMOTE}' not found in RCLONE_CONF (found: $(rclone listremotes | tr '\n' ' '))"; exit 1; }
          rclone copyto "${REMOTE}:${MEGA_CONF_FOLDER}/${MEGA_CONF_FILE}" "$RUNNER_TEMP/conf.xlsx" --retries 5 -q
          python3 scripts/load-config-from-mega.py "$RUNNER_TEMP/conf.xlsx" "$ACCOUNT"
          rm -f "$RUNNER_TEMP/conf.xlsx"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Record baseline IP (runner's own IP, before the phone)
        run: echo "BASELINE_IP=$(curl -s --max-time 20 https://ifconfig.me)" | tee -a $GITHUB_ENV

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ---- 1. restore the clean emulator (Facebook installed, snapshot fb_ready) from the 90-day artifact ----
      # Nothing is stored between runs except that artifact, which "FB - Build emulator + install Facebook" creates.
      - name: Restore emulator from the 90-day artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/restore-emulator.sh

      # ---- 2. boot snapshot -> phone exit node -> login -> backup -> Mega ----
      - name: Boot emulator, download on runner IP, restore on phone IP
        env:
          PHONE_IP: ${{ env.PHONE_IP }}
          BASELINE_IP: ${{ env.BASELINE_IP }}
          EXPECTED_PHONE_IP: ${{ secrets.EXPECTED_PHONE_IP }}
          PACKAGE_NAME: com.facebook.katana
          FB_IDENTIFIER: ${{ env.FB_IDENTIFIER }}
          FB_PASSWORD: ${{ env.FB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
          RESTORE_FILE: ${{ github.event.inputs.backup_file }}
          MEGA_FOLDER: facebook-android-backup
          MEGA_FILE: ${{ env.MEGA_FILE }}      # fb-session-<email>.tgz.enc, from the sheet
        run: |
          bash scripts/run-with-emulator.sh bash scripts/restore-session.sh

      - name: Print logs
        if: always()
        run: |
          echo "=== tailscale status ==="; tailscale status || true
          echo "=== run.log ==="; cat artifacts/run.log 2>/dev/null || echo "no run.log"

      - name: Upload screenshots + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-restore-session
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
