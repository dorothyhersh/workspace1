name: FB - Login every account separately (phone IP), backup each to Mega, update sheet

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: "Which accounts from the Mega sheet: all, or emails separated by commas"
        required: false
        default: "all"

permissions:
  contents: read
  actions: read

env:
  CACHE_PREFIX: emu-fb-api30-
  PHONE_IP: 100.85.72.32
  MEGA_CONF_FOLDER: Fbworkflow
  MEGA_CONF_FILE: login_Setup_Setting_workflow_conf.xlsx
  MEGA_REMOTE: mega          # must be the remote name inside your RCLONE_CONF (scripts/config.sh uses the same)

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # ---- 0. read email / password / tailscale keys from the xlsx in Mega ----
      - name: Load settings from Mega (Fbworkflow/login_Setup_Setting_workflow_conf.xlsx)
        env:
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
          ACCOUNTS: ${{ github.event.inputs.accounts }}
        run: |
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j /tmp/rclone.zip '*/rclone' -d /tmp && sudo install -m755 /tmp/rclone /usr/local/bin/rclone
          pip install -q openpyxl
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF_CONTENT" > ~/.config/rclone/rclone.conf
          REMOTE="$MEGA_REMOTE"
          rclone listremotes | grep -qx "${REMOTE}:" || { echo "remote '${REMOTE}' not found in RCLONE_CONF (found: $(rclone listremotes | tr '\n' ' '))"; exit 1; }
          rclone copyto "${REMOTE}:${MEGA_CONF_FOLDER}/${MEGA_CONF_FILE}" "$RUNNER_TEMP/conf.xlsx" --retries 5 -q
          python3 scripts/load-config-from-mega.py "$RUNNER_TEMP/conf.xlsx" "${ACCOUNTS:-all}" --json "$RUNNER_TEMP/accounts.json"
          rm -f "$RUNNER_TEMP/conf.xlsx"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Record baseline IP (runner's own IP, before the phone)
        run: echo "BASELINE_IP=$(curl -s --max-time 20 https://ifconfig.me)" | tee -a $GITHUB_ENV

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ---- 1. restore the emulator backup (Facebook already installed, snapshot fb_ready) ----
      - name: Restore emulator backup from cache (fast path)
        id: cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ env.CACHE_PREFIX }}none
          restore-keys: ${{ env.CACHE_PREFIX }}
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-30
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/platform-tools

      # Cache is deleted after 7 days without use, so when it is missing the emulator comes from the
      # 90-day artifact that "FB - Build emulator + install Facebook" saved in THIS repository.
      # (After the run, the emulator is saved to the cache again, so the next runs are fast.)
      - name: Cache missing -> restore emulator from the build workflow artifact
        if: steps.cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fb-emulator-build.yml --status success --limit 5 --json databaseId --jq '.[0].databaseId')
          [ -n "$RUN_ID" ] || { echo "No successful build run found - run 'FB - Build emulator + install Facebook' first (its artifact lasts 90 days)"; exit 1; }
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n emulator-backup -D "$RUNNER_TEMP/emu" \
            || { echo "Artifact expired (90 days) - run 'FB - Build emulator + install Facebook' again"; exit 1; }
          zstd -d -T0 -c "$RUNNER_TEMP/emu/avd.tar.zst" | tar -C "$HOME" -xf -
          rm -rf "$RUNNER_TEMP/emu"

      - name: Verify emulator backup is present
        run: |
          ls -la ~/.android/avd/fb-base.avd/snapshots/
          test -d ~/.android/avd/fb-base.avd/snapshots/fb_ready

      # ---- 2. boot snapshot -> phone exit node -> login -> backup -> Mega ----
      - name: Boot emulator, phone IP, log in every account separately, backup to Mega, update sheet
        env:
          PHONE_IP: ${{ env.PHONE_IP }}
          BASELINE_IP: ${{ env.BASELINE_IP }}
          EXPECTED_PHONE_IP: ${{ secrets.EXPECTED_PHONE_IP }}
          PACKAGE_NAME: com.facebook.katana
          ACCOUNTS_JSON: ${{ env.ACCOUNTS_JSON }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
          MEGA_FOLDER: facebook-android-backup
          MEGA_CONF_FOLDER: ${{ env.MEGA_CONF_FOLDER }}
          MEGA_CONF_FILE: ${{ env.MEGA_CONF_FILE }}
        run: |
          bash scripts/run-with-emulator.sh bash -c 'timeout 300 bash scripts/use-phone-exit-node.sh && bash scripts/login-backup.sh'

      # First run (or after 7 idle days) comes from Mega; this saves it to the GitHub cache so every
      # next run restores it in seconds instead of downloading >1 GB from Mega again.
      - name: Save emulator to cache (skips the Mega download next time)
        if: always() && steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-30
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/platform-tools

      - name: Print logs
        if: always()
        run: |
          echo "=== tailscale status ==="; tailscale status || true
          echo "=== run.log ==="; cat artifacts/run.log 2>/dev/null || echo "no run.log"

      - name: Upload screenshots + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-login-backup
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
