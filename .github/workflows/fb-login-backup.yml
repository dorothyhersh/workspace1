name: FB - Restore emulator, login (phone IP) and backup Facebook login to Mega

on:
  workflow_dispatch:
    inputs:
      account:
        description: "FB_IDENTIFIER (email) row to use from the Mega sheet. Empty = first row."
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  CACHE_PREFIX: emu-fb-api30-
  PHONE_IP: 100.85.72.32
  MEGA_CONF_FOLDER: Fbworkflow
  MEGA_CONF_FILE: login_Setup_Setting_workflow_conf.xlsx
  # MEGA_REMOTE: mega        # set only if the remote in your RCLONE_CONF is not the first one

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # ---- 0. read email / password / tailscale keys from the xlsx in Mega ----
      - name: Load settings from Mega (Fbworkflow/login_Setup_Setting_workflow_conf.xlsx)
        env:
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
          ACCOUNT: ${{ github.event.inputs.account }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          pip install -q openpyxl
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF_CONTENT" > ~/.config/rclone/rclone.conf
          REMOTE="${MEGA_REMOTE:-$(rclone listremotes | head -n1 | tr -d ':')}"
          [ -n "$REMOTE" ] || { echo "no rclone remote found in RCLONE_CONF"; exit 1; }
          rclone copyto "${REMOTE}:${MEGA_CONF_FOLDER}/${MEGA_CONF_FILE}" "$RUNNER_TEMP/conf.xlsx" --retries 5 -q
          python3 scripts/load-config-from-mega.py "$RUNNER_TEMP/conf.xlsx" "$ACCOUNT"
          rm -f "$RUNNER_TEMP/conf.xlsx"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Record baseline IP (runner's own IP, before the phone)
        run: echo "BASELINE_IP=$(curl -s --max-time 20 https://ifconfig.me)" | tee -a $GITHUB_ENV

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ---- 1. restore the emulator backup (Facebook already installed, snapshot fb_ready) ----
      - name: Restore emulator backup from cache (fast path)
        id: cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ env.CACHE_PREFIX }}none
          restore-keys: ${{ env.CACHE_PREFIX }}
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-30

      - name: Cache missing -> restore from artifact copy
        if: steps.cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fb-emulator-build.yml --status success --limit 5 --json databaseId --jq '.[0].databaseId')
          [ -n "$RUN_ID" ] || { echo "No successful build run found - run the build workflow first"; exit 1; }
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n emulator-backup -D "$RUNNER_TEMP/emu"
          zstd -d -T0 -c "$RUNNER_TEMP/emu/avd.tar.zst" | tar -C "$HOME" -xf -

      - name: Verify emulator backup is present
        run: |
          ls -la ~/.android/avd/fb-base.avd/snapshots/
          test -d ~/.android/avd/fb-base.avd/snapshots/fb_ready

      # ---- 2. boot snapshot -> phone exit node -> login -> backup -> Mega ----
      - name: Boot emulator, switch to phone IP, login, backup to Mega
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PHONE_IP: ${{ env.PHONE_IP }}
          BASELINE_IP: ${{ env.BASELINE_IP }}
          EXPECTED_PHONE_IP: ${{ secrets.EXPECTED_PHONE_IP }}
          PACKAGE_NAME: com.facebook.katana
          FB_IDENTIFIER: ${{ env.FB_IDENTIFIER }}
          FB_PASSWORD: ${{ env.FB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
          MEGA_FOLDER: facebook-android-backup
          MEGA_FILE: ${{ env.MEGA_FILE }}      # fb-session-<email>.tgz.enc, from the sheet
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: fb-base
          cores: 2
          ram-size: 3072M
          force-avd-creation: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics -snapshot fb_ready -no-snapshot-save
          disable-animations: false
          script: |
            timeout 300 bash scripts/use-phone-exit-node.sh
            bash scripts/login-backup.sh

      - name: Print logs
        if: always()
        run: |
          echo "=== tailscale status ==="; tailscale status || true
          echo "=== run.log ==="; cat artifacts/run.log 2>/dev/null || echo "no run.log"

      - name: Upload screenshots + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-login-backup
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
