name: FB - Build emulator + install Facebook + save FULL backup

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to the APK/zip (empty = use the zip in Mega)"
        required: false
        type: string
      also_artifact:
        description: "Also keep a 90-day artifact copy (cache is deleted after 7 days unused)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

env:
  CACHE_PREFIX: emu-fb-api30-

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download Facebook APK/zip
        env:
          APK_URL: ${{ inputs.apk_url }}
          APK_MEGA_FILE: facebook-apk/facebook.zip
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
        run: timeout 1000 bash emulatorbackup/download-apk.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create emulator, install Facebook, save snapshot
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PACKAGE_NAME: com.facebook.katana
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: fb-base
          cores: 2
          ram-size: 3072M
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics -no-snapshot-save
          disable-animations: true
          script: bash emulatorscripts/install-facebook.sh

      - name: Check snapshot exists on disk
        run: |
          ls -la ~/.android/avd/fb-base.avd/snapshots/ || true
          test -d ~/.android/avd/fb-base.avd/snapshots/fb_ready
          du -sh ~/.android/avd

      - name: Save FULL emulator backup to GitHub cache
        uses: actions/cache/save@v4
        with:
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-30

      - name: Delete older emulator caches (keep newest only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$CACHE_PREFIX" --sort created_at --order desc --limit 100 --json id --jq '.[1:] | .[] | .id' \
          | while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done

      - name: Pack AVD for artifact copy
        if: ${{ inputs.also_artifact }}
        run: tar -C "$HOME" -cf - .android/avd | zstd -T0 -3 > "$RUNNER_TEMP/avd.tar.zst"

      - name: Upload artifact copy (90 days)
        if: ${{ inputs.also_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: emulator-backup
          path: ${{ runner.temp }}/avd.tar.zst
          retention-days: 90
          compression-level: 0
