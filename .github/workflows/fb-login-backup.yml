name: FB - Login every account separately (GitHub runner exit node), backup each to Mega, update sheet

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: "Which accounts from the Mega sheet: all, or emails separated by commas"
        required: false
        default: "all"
      retry_checked:
        description: "Also try accounts that already have a STATUS in the sheet (active / suspended / failed ...). Default: skip them and only log in rows with an empty STATUS"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  # PHONE_IP is no longer hardcoded: the "Find the GitHub-runner exit node" step sets it
  # (via $GITHUB_ENV) to the current Tailscale IP of the running "gh-exit-node" runner.
  EXIT_NODE_HOSTNAME: gh-exit-node
  MEGA_CONF_FOLDER: Fbworkflow
  MEGA_CONF_FILE: login_Setup_Setting_workflow_conf.xlsx
  MEGA_REMOTE: mega          # must be the remote name inside your RCLONE_CONF (scripts/shared/config.sh uses the same)

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ---- 0. read email / password / tailscale keys from the xlsx in Mega ----
      - name: Load settings from Mega (Fbworkflow/login_Setup_Setting_workflow_conf.xlsx)
        env:
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
          ACCOUNTS: ${{ github.event.inputs.accounts }}
          RETRY_CHECKED: ${{ github.event.inputs.retry_checked }}
        run: |
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j /tmp/rclone.zip '*/rclone' -d /tmp && sudo install -m755 /tmp/rclone /usr/local/bin/rclone
          pip install -q openpyxl
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF_CONTENT" > ~/.config/rclone/rclone.conf
          REMOTE="$MEGA_REMOTE"
          rclone listremotes | grep -qx "${REMOTE}:" || { echo "remote '${REMOTE}' not found in RCLONE_CONF (found: $(rclone listremotes | tr '\n' ' '))"; exit 1; }
          rclone copyto "${REMOTE}:${MEGA_CONF_FOLDER}/${MEGA_CONF_FILE}" "$RUNNER_TEMP/conf.xlsx" --retries 5 -q
          SKIP=--skip-checked; [ "$RETRY_CHECKED" = "true" ] && SKIP=""
          python3 scripts/shared/load-config-from-mega.py "$RUNNER_TEMP/conf.xlsx" "${ACCOUNTS:-all}" --json "$RUNNER_TEMP/accounts.json" $SKIP
          rm -f "$RUNNER_TEMP/conf.xlsx"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify Tailscale is connected (fail fast)
        run: |
          STATE=$(tailscale status --json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("BackendState",""))' || true)
          echo "Tailscale state: ${STATE:-unknown}"
          if [ "$STATE" != "Running" ]; then
            echo "::error::Tailscale did not connect (state: ${STATE:-unknown}). Check TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET in the Mega sheet: they must be a valid OAuth client with Auth Keys: Write and tag:ci, in the same tailnet as the Exit Node workflow."
            exit 1
          fi

      - name: Record baseline IP (runner's own IP, before the exit node)
        run: echo "BASELINE_IP=$(curl -s --max-time 20 https://ifconfig.me)" | tee -a $GITHUB_ENV

      # ---- NEW: find the running GitHub-runner exit node and use its Tailscale IP ----
      # Requires the separate "Exit Node" workflow to be running (it advertises hostname gh-exit-node).
      - name: Find the GitHub-runner exit node (gh-exit-node)
        run: |
          IP=""
          for i in $(seq 1 45); do
            IP=$(tailscale status --json | EXIT_NODE_HOSTNAME="$EXIT_NODE_HOSTNAME" python3 -c '
          import json, os, sys
          prefix = os.environ["EXIT_NODE_HOSTNAME"]
          d = json.load(sys.stdin)
          for p in (d.get("Peer") or {}).values():
              if p.get("HostName", "").startswith(prefix) and p.get("ExitNodeOption") and p.get("Online"):
                  print(p["TailscaleIPs"][0])
                  break
          ')
            [ -n "$IP" ] && break
            echo "waiting for an online ${EXIT_NODE_HOSTNAME} exit node... ($i/45)"
            sleep 2
          done
          if [ -z "$IP" ]; then
            echo "::error::No online ${EXIT_NODE_HOSTNAME} exit node found. Start the 'Exit Node' workflow first and wait until it prints its IPs."
            tailscale status || true
            exit 1
          fi
          echo "Found exit node at $IP"
          echo "PHONE_IP=$IP" | tee -a "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ---- 1. restore the clean emulator (Facebook installed, snapshot fb_ready) from the 90-day artifact ----
      # Nothing is stored between runs except that artifact, which "FB - Build emulator + install Facebook" creates.
      - name: Restore emulator from the 90-day artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/shared/restore-emulator.sh

      # ---- 2a. exit node (own step: hard 4 min limit, so a stuck tailscale can never block the job) ----
      - name: Route traffic through the GitHub-runner exit node
        timeout-minutes: 4
        env:
          PHONE_IP: ${{ env.PHONE_IP }}
          BASELINE_IP: ${{ env.BASELINE_IP }}
        run: timeout -k 5 200 bash scripts/shared/use-phone-exit-node.sh

      # ---- 2b. boot snapshot -> login -> (captcha: play audio + record) -> backup -> Mega -> sheet ----
      - name: Boot emulator, log in every account separately, backup to Mega, update sheet
        timeout-minutes: 50
        env:
          PYTHONUNBUFFERED: '1'
          PHONE_IP: ${{ env.PHONE_IP }}
          BASELINE_IP: ${{ env.BASELINE_IP }}
          # The old secret held your real phone's public IP. The exit node is now a GitHub runner,
          # so that check would fail. Left empty on purpose (see note in the chat).
          EXPECTED_PHONE_IP: ''
          PACKAGE_NAME: com.facebook.katana
          ACCOUNTS_JSON: ${{ env.ACCOUNTS_JSON }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
          MEGA_FOLDER: facebook-android-backup
          MEGA_CONF_FOLDER: ${{ env.MEGA_CONF_FOLDER }}
          MEGA_CONF_FILE: ${{ env.MEGA_CONF_FILE }}
          GH_TOKEN: ${{ github.token }}   # lets run-with-emulator.sh fetch an OLDER emulator build if the newest snapshot is broken
          CAPTURE_CAPTCHA_AUDIO: '1'      # 1 = try to find + tap "play audio" on the captcha. 0 = off entirely
          CAPTCHA_TAP_ONLY: '1'           # 1 (debug) = just tap + screenshot every attempt, NO recording. 0 = also record wav/mp3/mp4
          CAPTCHA_AUDIO_SECONDS: '20'     # only used once CAPTCHA_TAP_ONLY=0
          CAPTCHA_AUDIO_TAP: '727 837'    # last-resort fallback tap if no detection method finds the button
        run: bash scripts/shared/run-with-emulator.sh bash scripts/fb-login-backup/login-backup.sh

      # Insurance: login-backup.sh already switches the exit node off itself before its own Mega
      # upload (switch_to_runner_ip in the script), but this step runs regardless of whether that
      # succeeded, and *before* the two upload-artifact steps below - so screenshots/logs/captcha
      # files always go to GitHub over the runner's own IP, never routed through the exit node.
      - name: Switch off exit node (use runner's own IP for GitHub artifact uploads)
        if: always()
        run: |
          echo "tailscale status BEFORE:"; timeout 15 tailscale status || true
          timeout -k 3 30 sudo tailscale set --exit-node= || echo "::warning::could not clear the exit node (may already be off)"
          sleep 2
          echo "tailscale status AFTER:"; timeout 15 tailscale status || true
          echo "runner public IP now: $(curl -s --max-time 15 https://ifconfig.me || echo unknown)  (baseline was: ${BASELINE_IP:-unknown})"

      - name: Print logs
        if: always()
        run: |
          echo "=== tailscale status ==="; timeout 15 tailscale status || true
          echo "=== run.log ==="; cat artifacts/run.log 2>/dev/null || echo "no run.log"

      - name: Upload screenshots + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-login-backup
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3

      # captcha audio (wav + mp3), screen recording (mp4 with audio), screenshots and UI dump as their own artifact
      - name: Upload captcha audio + screen recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-captcha-audio
          path: |
            artifacts/*captcha*.wav
            artifacts/*captcha*.mp3
            artifacts/*captcha*.mp4
            artifacts/*captcha*.png
            artifacts/*captcha*.xml
          if-no-files-found: ignore
          retention-days: 7
