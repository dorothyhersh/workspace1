name: FB - Build emulator + install Facebook + save FULL backup

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to the APK/zip (empty = use the zip in Mega)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Was 40: the hardened install-facebook.sh can now retry the save-and-verify cycle up to 3 times
    # (each retry = a full reboot + up to ~420s boot wait + up to ~90s pm wait) before giving up, which
    # can legitimately take longer than the old blind single-shot version. Bumped so a slow-but-working
    # verification run isn't killed by the job timeout before it gets a fair chance to pass.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Download Facebook APK/zip
        env:
          APK_URL: ${{ inputs.apk_url }}
          APK_MEGA_FILE: facebook-apk/facebook.zip
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
        run: timeout 1000 bash scripts/fb-emulator-build/download-apk.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create emulator, install Facebook, save snapshot
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PACKAGE_NAME: com.facebook.katana
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: fb-base
          cores: 2
          ram-size: 2048M
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics -no-snapshot-save
          disable-animations: true
          script: bash scripts/fb-emulator-build/install-facebook.sh

      - name: Check snapshot exists on disk
        run: |
          ls -la ~/.android/avd/fb-base.avd/snapshots/ || true
          test -d ~/.android/avd/fb-base.avd/snapshots/fb_ready
          du -sh ~/.android/avd

      # The emulator is kept as an artifact for 90 days (the maximum GitHub allows).
      - name: Pack emulator (AVD + SDK emulator + system image)
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          tar -C "$HOME" -cf - .android/avd | zstd -T0 -3 > "$RUNNER_TEMP/pack/avd.tar.zst"
          tar -C /usr/local/lib/android/sdk -cf - emulator system-images/android-30 | zstd -T0 -3 > "$RUNNER_TEMP/pack/sdk.tar.zst"
          ls -la "$RUNNER_TEMP/pack"

      - name: Upload emulator artifact (kept 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: emulator-backup
          path: ${{ runner.temp }}/pack/
          retention-days: 90
          compression-level: 0
