name: Emulator Screenshots - Infinix Smart 8 Plus Screen Profile

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Device model to show in About phone"
        default: "Infinix Smart 8 Plus"
      brand:
        description: "Brand"
        default: "Infinix"
      manufacturer:
        description: "Manufacturer"
        default: "INFINIX"
      build:
        description: "Build number (ro.build.display.id)"
        default: "X6526-H894ABCD-T-GL-240115V1220"
      apk_folder:
        description: "Mega folder with the Facebook APK files (or a zip)"
        default: "facebook-apk"
      mega_link:
        description: "Optional: public mega.nz folder/file link (used instead of rclone)"
        default: ""
      refresh_apks:
        description: "Ignore cache and re-download APKs from Mega (true/false)"
        default: "false"
      live:
        description: "Keep emulator alive for live scrcpy view (true/false)"
        default: "true"
      live_minutes:
        description: "Max minutes to keep it alive (max 340)"
        default: "340"

jobs:
  emulator-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEVICE_MODEL: ${{ github.event.inputs.model || 'Infinix Smart 8 Plus' }}
      DEVICE_BRAND: ${{ github.event.inputs.brand || 'Infinix' }}
      DEVICE_MANUF: ${{ github.event.inputs.manufacturer || 'INFINIX' }}
      DEVICE_BUILD: ${{ github.event.inputs.build || 'X6526-H894ABCD-T-GL-240115V1220' }}
      MEGA_REMOTE: mega
      MEGA_APK_FOLDER: ${{ github.event.inputs.apk_folder || 'facebook-apk' }}
      MEGA_LINK: ${{ github.event.inputs.mega_link || '' }}
      REFRESH_APKS: ${{ github.event.inputs.refresh_apks || 'false' }}
      LIVE: ${{ github.event.inputs.live || 'true' }}
      LIVE_MINUTES: ${{ github.event.inputs.live_minutes || '340' }}
      # Make scrcpy use the SDK adb (same one the emulator runner uses)
      ADB: /usr/local/lib/android/sdk/platform-tools/adb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore APK cache
        id: apkcache
        if: env.REFRESH_APKS != 'true'
        uses: actions/cache/restore@v4
        with:
          path: apks
          key: facebook-apks-${{ env.MEGA_APK_FOLDER }}-${{ github.run_id }}
          restore-keys: |
            facebook-apks-${{ env.MEGA_APK_FOLDER }}-

      - name: Decide if download is needed
        id: need
        run: |
          need=true
          if [ -n "${{ steps.apkcache.outputs.cache-matched-key }}" ] && [ -n "$(find apks -type f -name '*.apk' 2>/dev/null | head -n1)" ]; then
            need=false
          fi
          echo "need=$need" >> "$GITHUB_OUTPUT"
          echo "Download needed: $need"

      - name: Setup rclone (Mega)
        if: steps.need.outputs.need == 'true'
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONF }}
        run: |
          set -e
          cd /tmp
          curl -fsSL -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -oq rclone-current-linux-amd64.zip
          sudo install -m 755 rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          rclone version | head -1
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          [ -s ~/.config/rclone/rclone.conf ] || { echo "RCLONE_CONF secret is empty"; exit 1; }
          echo "Remotes in config:"
          rclone listremotes
          rclone listremotes | grep -q "^${MEGA_REMOTE}:$" || { echo "Remote '${MEGA_REMOTE}:' not found in RCLONE_CONF (section must be [${MEGA_REMOTE}])"; exit 1; }

      - name: Download Facebook APKs from Mega
        id: download
        if: steps.need.outputs.need == 'true'
        run: |
          set -u
          DEST="$GITHUB_WORKSPACE/apks"
          rm -rf "$DEST"; mkdir -p "$DEST"

          if [ -n "${MEGA_LINK:-}" ]; then
            echo "== Using public Mega link via megatools =="
            sudo apt-get install -y megatools > /dev/null
            for try in 1 2 3; do
              megadl --path "$DEST" "$MEGA_LINK" && break
              echo "megadl failed (try $try), waiting 30s"; sleep 30
            done
          else
            echo "== Mega account root =="
            rclone lsd "${MEGA_REMOTE}:" 2>&1 | head -n 30 || true
            echo "== Folder contents: ${MEGA_APK_FOLDER} =="
            rclone lsf -R "${MEGA_REMOTE}:${MEGA_APK_FOLDER}" 2>&1 | head -n 50 || true

            for try in 1 2 3; do
              rclone copy "${MEGA_REMOTE}:${MEGA_APK_FOLDER}" "$DEST" \
                --include "*.apk" --include "*.zip" --include "*.xapk" --include "*.apks" --include "*.apkm" \
                --transfers 2 --retries 5 --low-level-retries 20 --stats 15s -v && break
              echo "rclone copy failed (try $try), waiting 30s"; sleep 30
            done

            # Fallback: fetch facebook.zip directly by name
            if [ -z "$(find "$DEST" -type f | head -n1)" ]; then
              echo "== Fallback: copying facebook.zip directly =="
              rclone copyto "${MEGA_REMOTE}:${MEGA_APK_FOLDER}/facebook.zip" "$DEST/facebook.zip" \
                --retries 5 --low-level-retries 20 --stats 15s -v || true
            fi
          fi

          cd "$DEST"
          echo "== Downloaded =="
          find . -type f -exec ls -lh {} \;
          [ -n "$(find . -type f | head -n1)" ] || { echo "ERROR: nothing was downloaded from Mega. Check RCLONE_CONF, the folder name, and Mega transfer quota (see log above)."; exit 1; }

          for z in *.zip *.xapk *.apks *.apkm; do
            [ -e "$z" ] || continue
            echo "Testing $z"
            unzip -tq "$z" > /dev/null || { echo "ERROR: $z is corrupt/incomplete (download was cut off - run again)"; exit 1; }
            echo "Unzipping $z"
            unzip -oq "$z" -d "extracted_${z%.*}"
          done

          # unzip nested archives one level deeper if needed
          for z in $(find . -mindepth 2 -type f \( -name '*.zip' -o -name '*.xapk' -o -name '*.apks' -o -name '*.apkm' \)); do
            echo "Unzipping nested $z"
            unzip -oq "$z" -d "${z%.*}_x"
          done

          echo "== APK files found =="
          find . -type f -name '*.apk' | sort
          [ -n "$(find . -type f -name '*.apk')" ] || { echo "ERROR: no .apk inside the downloaded files (see list above)"; exit 1; }

      - name: Save APK cache
        if: steps.need.outputs.need == 'true' && steps.download.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: apks
          key: facebook-apks-${{ env.MEGA_APK_FOLDER }}-${{ github.run_id }}

      - name: Upload APKs as artifact (downloadable copy)
        if: steps.need.outputs.need == 'true' && steps.download.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: facebook-apks
          path: apks/
          retention-days: 7

      - name: Verify APKs are present
        run: |
          set -e
          find apks -type f -name '*.apk' | sort
          [ -n "$(find apks -type f -name '*.apk')" ] || { echo "No .apk files in apks/"; exit 1; }

      - name: Install scrcpy (without its bundled adb)
        run: |
          mkdir -p "$HOME/scrcpy"
          URL=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/Genymobile/scrcpy/releases/latest \
            | grep -o 'https://[^"]*scrcpy-linux-x86_64-[^"]*\.tar\.gz' | head -n1)
          echo "Downloading: $URL"
          [ -n "$URL" ] || { echo "No linux release asset found"; exit 1; }
          curl -sL "$URL" | tar -xz -C "$HOME/scrcpy" --strip-components=1
          # Remove bundled adb so two adb versions never fight (that makes the device go offline)
          rm -f "$HOME/scrcpy/adb"
          ls -l "$HOME/scrcpy"
          echo "$HOME/scrcpy" >> "$GITHUB_PATH"
          "$HOME/scrcpy/scrcpy" --version
          "$ADB" version

      - name: Join Tailscale (live view)
        if: env.LIVE == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-emulator

      - name: Prepare SSH access (live view)
        if: env.LIVE == 'true'
        run: |
          sudo apt-get install -y openssh-server > /dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.LIVE_SSH_PUBKEY }}" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh || sudo service ssh start
          echo "=============================================="
          echo "Runner Tailscale IP: $(tailscale ip -4 | head -n1)"
          echo "On Lubuntu run:  ~/live-scrcpy.sh $(tailscale ip -4 | head -n1)"
          echo "=============================================="
          {
            echo "### Live view"
            echo "Runner Tailscale IP: \`$(tailscale ip -4 | head -n1)\`"
            echo ""
            echo "Wait for the emulator step to print **LIVE NOW**, then on Lubuntu:"
            echo '```'
            echo "ssh -N -L 5555:127.0.0.1:5555 runner@$(tailscale ip -4 | head -n1) &"
            echo "adb kill-server; adb connect 127.0.0.1:5555"
            echo "scrcpy -s 127.0.0.1:5555 --max-size=1024 --max-fps=20"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create helper library (emulator restart + boot wait)
        run: |
          mkdir -p scripts
          cat > scripts/lib.sh <<'LIB'
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AVD_NAME="${AVD_NAME:-test}"
          EMU_OPTS="-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -memory 4096 -cores 4"

          emulator_alive() { pgrep -f "qemu-system" >/dev/null 2>&1; }

          # Start (or restart) the emulator ourselves, so we do not depend on
          # the emulator surviving "adb reboot" or the first boot of the runner action
          start_emulator() {
            mkdir -p screenshots
            echo "== (re)starting emulator '$AVD_NAME' =="
            pkill -f "qemu-system" 2>/dev/null || true
            sleep 3
            adb start-server >/dev/null 2>&1 || true
            nohup setsid "$SDK/emulator/emulator" -avd "$AVD_NAME" -port 5554 $EMU_OPTS \
              >> screenshots/emulator_relaunch.log 2>&1 &
            sleep 10
          }

          # Wait until the device is online AND booted; restart the emulator if it never shows up
          wait_boot() {
            local n=0 relaunched=0
            sleep 8
            until [ "$(adb get-state 2>/dev/null | tr -d '\r')" = "device" ]; do
              adb reconnect offline >/dev/null 2>&1 || true
              sleep 3; n=$((n+1))
              if [ "$n" -ge 20 ] && [ "$relaunched" = 0 ]; then
                echo "device not online after 60s (emulator alive: $(emulator_alive && echo yes || echo no)) -> restarting emulator"
                start_emulator; relaunched=1; n=0
              fi
              [ "$n" -gt 80 ] && { echo "device never came online"; return 1; }
            done
            n=0
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
              sleep 2; n=$((n+1))
              [ "$n" -gt 150 ] && { echo "boot timeout"; return 1; }
            done
            sleep 5
          }

          reboot_device() {
            adb reboot
            sleep 15
            emulator_alive || start_emulator
            wait_boot
          }
          LIB

      - name: Create set-model script
        run: |
          mkdir -p scripts
          cat > scripts/set-model.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail

          MODEL="${1:-Infinix Smart 8 Plus}"
          BRAND="${2:-Infinix}"
          MANUF="${3:-INFINIX}"
          BUILD="${4:-}"

          source "$(dirname "$0")/lib.sh"

          echo "== Patching model to: $MODEL / $BRAND / $MANUF / build: ${BUILD:-<unchanged>} =="

          BUILD_SED=""
          if [ -n "$BUILD" ]; then
            BUILD_SED="-e 's|^(ro\.([a-z_]+\.)?build\.display\.id)=.*|\1=${BUILD}|'"
          fi

          cat > /tmp/patch.sh <<EOF
          for f in \$(find /system /system_ext /product /vendor /odm -maxdepth 3 -type f -name build.prop 2>/dev/null); do
            sed -i -E \\
              -e 's|^(ro\.product\.([a-z_]+\.)?model)=.*|\1=${MODEL}|' \\
              -e 's|^(ro\.product\.([a-z_]+\.)?brand)=.*|\1=${BRAND}|' \\
              -e 's|^(ro\.product\.([a-z_]+\.)?manufacturer)=.*|\1=${MANUF}|' \\
              ${BUILD_SED} \\
              "\$f"
            grep -H -E '^ro\.product\.([a-z_]+\.)?(model|brand|manufacturer)=|^ro\.([a-z_]+\.)?build\.display\.id=' "\$f"
          done
          echo "source_order: \$(getprop ro.product.property_source_order)"
          EOF

          wait_boot || exit 1
          adb root; sleep 3
          adb disable-verity
          reboot_device || exit 1
          adb root; sleep 3
          adb remount || { echo "remount failed"; exit 1; }

          adb push /tmp/patch.sh /data/local/tmp/patch.sh
          echo "== Files patched =="
          adb shell sh /data/local/tmp/patch.sh

          reboot_device || exit 1

          echo "== Result =="
          adb shell getprop ro.product.model
          adb shell getprop ro.product.brand
          adb shell getprop ro.product.manufacturer
          adb shell getprop ro.build.display.id
          adb shell getprop ro.product.cpu.abilist
          SCRIPT
          chmod +x scripts/set-model.sh

      - name: Create session script
        run: |
          mkdir -p scripts
          cat > scripts/run-session.sh <<'RUNSCRIPT'
          #!/usr/bin/env bash
          set -u
          mkdir -p screenshots
          source "$(dirname "$0")/lib.sh"

          # Make sure the device is online before every phase
          ensure_online() {
            local n=0
            until [ "$(adb get-state 2>/dev/null | tr -d '\r')" = "device" ]; do
              adb reconnect offline >/dev/null 2>&1 || true
              sleep 3; n=$((n+1))
              [ "$n" -gt 40 ] && { echo "device still offline"; return 1; }
            done
          }

          # Make sure an emulator is really running (restarts it if the runner's one died)
          wait_boot || echo "emulator did not come up"

          bash scripts/set-model.sh "$DEVICE_MODEL" "$DEVICE_BRAND" "$DEVICE_MANUF" "$DEVICE_BUILD" > screenshots/set_model_log.txt 2>&1 || echo "Model patch failed, continuing with default model"
          cat screenshots/set_model_log.txt

          ensure_online
          adb devices
          adb shell "settings put global device_name '$DEVICE_MODEL'" || echo "device_name failed"

          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell settings put global policy_control immersive.full=*
          adb shell settings put global policy_control null
          adb shell settings put secure show_ime_with_hard_keyboard 0
          adb shell wm size 720x1612
          adb shell wm density 270
          sleep 10

          # Lightweight recording (software GPU + 2-4 cores is easily overloaded)
          ensure_online
          SDL_VIDEODRIVER=dummy nohup scrcpy -s emulator-5554 --no-window --no-audio --no-control \
            --max-size=1024 --max-fps=15 --video-bit-rate=2M \
            --record=screenshots/session.mkv --record-format=mkv \
            > screenshots/scrcpy_log.txt 2>&1 &
          sleep 5
          cat screenshots/scrcpy_log.txt

          adb shell input keyevent KEYCODE_WAKEUP
          adb shell input keyevent 82
          adb shell input keyevent KEYCODE_HOME
          sleep 8
          adb exec-out screencap -p > screenshots/01_home.png

          adb shell am start -a android.settings.SETTINGS
          sleep 8
          adb exec-out screencap -p > screenshots/02_settings.png

          adb shell am start -a android.settings.DEVICE_INFO_SETTINGS
          sleep 8
          adb exec-out screencap -p > screenshots/03_about_phone_top.png

          adb shell input swipe 360 1300 360 500 400
          sleep 3
          adb exec-out screencap -p > screenshots/04_about_phone_scrolled.png

          adb shell input swipe 360 1300 360 500 400
          sleep 3
          adb exec-out screencap -p > screenshots/05_about_phone_scrolled_more.png

          adb shell am start -a android.settings.DISPLAY_SETTINGS
          sleep 6
          adb exec-out screencap -p > screenshots/06_display_settings.png

          adb install-multiple -r -g $(find apks -type f -name '*.apk' | sort) > screenshots/install_log.txt 2>&1 || echo "APK install failed"
          cat screenshots/install_log.txt
          adb shell pm list packages | grep -i facebook || echo "facebook package not found"
          adb shell monkey -p com.facebook.katana -c android.intent.category.LAUNCHER 1
          sleep 15
          adb exec-out screencap -p > screenshots/07_facebook.png

          # Stop recording cleanly so the .mkv is finalized
          pkill -INT -x scrcpy || echo "scrcpy was not running"
          sleep 5

          adb shell wm size > screenshots/display_info.txt
          adb shell wm density >> screenshots/display_info.txt
          adb shell getprop > screenshots/all_props.txt
          adb shell getprop ro.product.model > screenshots/model.txt
          adb shell getprop ro.product.brand >> screenshots/model.txt
          adb shell getprop ro.product.manufacturer >> screenshots/model.txt
          adb shell getprop ro.build.display.id >> screenshots/model.txt
          adb shell getprop ro.build.version.release >> screenshots/model.txt
          adb shell getprop ro.product.cpu.abilist >> screenshots/model.txt

          ls -l screenshots

          if [ "$LIVE" = "true" ]; then
            adb shell svc power stayon true
            IP=$(tailscale ip -4 | head -n1)
            echo "=============================================="
            echo "LIVE NOW -> runner@$IP"
            echo "On Lubuntu:"
            echo "  ssh -N -L 5555:127.0.0.1:5555 runner@$IP &"
            echo "  adb kill-server; adb connect 127.0.0.1:5555"
            echo "  scrcpy -s 127.0.0.1:5555 --max-size=1024 --max-fps=20"
            echo "=============================================="
            m=$LIVE_MINUTES
            [ "$m" -gt 340 ] && m=340
            end=$(( $(date +%s) + m * 60 ))
            while [ ! -f /tmp/stop-live ] && [ "$(date +%s)" -lt "$end" ]; do
              # keep the device from silently going offline during the live session
              [ "$(adb get-state 2>/dev/null | tr -d '\r')" = "device" ] || adb reconnect offline >/dev/null 2>&1 || true
              sleep 20
            done
          fi
          RUNSCRIPT
          chmod +x scripts/run-session.sh

      - name: Start Emulator + Install Facebook + Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: test
          ram-size: 4096M
          disk-size: 8G
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics
          disable-animations: true
          script: bash scripts/run-session.sh

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 7
